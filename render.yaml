services:
  - type: web
    name: digital-growth-backend
    env: python
    plan: free
    region: oregon
    buildCommand: |
      cd backend
      pip install -r requirements/base.txt
    startCommand: |
      cd backend
      python manage.py migrate
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: digital-growth-backend.onrender.com
      - key: FRONTEND_URL
        value: https://digital-growth-frontend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: digital-growth-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://digital-growth-frontend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://digital-growth-frontend.onrender.com
    autoDeploy: true

  - type: static
    name: digital-growth-frontend
    plan: free
    region: oregon
    buildCommand: |
      cd frontend
      npm install
      npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://digital-growth-backend.onrender.com

databases:
  - name: digital-growth-db
    databaseName: digital_growth
    user: postgres
    plan: free
